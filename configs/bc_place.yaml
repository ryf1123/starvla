data:
  path: data/demos/place800
  val_frac: 0.1
  shift_aug: 4
  limit: null          # 只用前 N 条演示（数据量曲线用）
model:
  horizon: 8
  lang_mode: cls       # none / bow / seq / cls / ppool / ptok
  film: true
  backbone: cnn        # cnn（从零 4 层）/ resnet18（ImageNet 预训练）
  pretrained: true
  freeze_backbone: false
  text_model: BAAI/bge-small-zh-v1.5
  pre_dim: 512
  aux_weight: 0.0      # >0 时开启"目标在图像哪个像素"的辅助监督
  ss_raw: true         # 空间 softmax 前不接 ReLU/归一化（false 是第一版的写法）
  last_stride: 1       # 最后一层卷积的步长：1 → 16×16 特征图，2 → 8×8
  head: regress        # regress / discrete / diffusion
  n_bins: 41           # discrete 头每个维度的格子数
  diff_steps: 100      # diffusion 头训练用的噪声步数
  diff_infer_steps: 10 # 推理时 DDIM 步数
  cams: [front, wrist]
train:
  steps: 12000
  batch_size: 64
  lr: 3.0e-4
  wd: 1.0e-4
  workers: 0
  log_every: 100
  val_every: 1000
  save_ckpts: [4000, 8000, 12000]   # 中途存档，用来画成功率 vs 步数曲线
eval:
  episodes: 50
  same_color_prob: 0.0   # 评测场景里两个方块同色的概率，必须和训练数据一致
  ensemble_k: 4        # 时间集成窗口。消融期间统一用 4 保持可比；实测 k=1 更好（83.8% vs 72.5%），见 notes/07

data:
  path: data/demos/place2p
  val_frac: 0.1
  shift_aug: 4
model:
  horizon: 8
  lang_mode: seq       # seq / bow / none
  film: true
  cams: [front, wrist]
train:
  steps: 12000
  batch_size: 64
  lr: 3.0e-4
  wd: 1.0e-4
  workers: 0
  log_every: 100
  val_every: 1000
eval:
  episodes: 50
  ensemble_k: 4        # 时间集成用最近 k 次预测
